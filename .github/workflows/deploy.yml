name: Deploy Web Application

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # IMPORTANT: To use this workflow, you need to add your AWS credentials as GitHub Action Secrets.
      # Go to your repository settings -> Secrets and variables -> Actions
      # Add: AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
      # Alternatively, set up OIDC, which is the recommended way now. For simplicity, we use keys here.
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Deploy to S3
        # Replace BUCKET_NAME with your actual bucket name after you run Terraform for the first time
        run: aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        # Replace DISTRIBUTION_ID with your actual CloudFront ID from Terraform output
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
